name: Restore Somfy brand assets
on:
  push:
    paths:
      - 'custom_components/somfy_protexial/manifest.json'
permissions:
  contents: write
jobs:
  restore-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy original brand images from standard integration
        run: |
          set -euo pipefail
          src=https://raw.githubusercontent.com/AuroreVgn/somfy-protexial/main/custom_components/somfy_protexial/brand
          mkdir -p custom_components/somfy_protexial/brand
          for name in icon.png icon@2x.png logo.png logo@2x.png; do
            curl --fail --location --silent --show-error "$src/$name" -o "custom_components/somfy_protexial/brand/$name"
          done
          file custom_components/somfy_protexial/brand/*.png
      - name: Commit brand files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/somfy_protexial/brand
          if ! git diff --cached --quiet; then
            git commit -m "fix: restore original Somfy brand PNG assets"
            git push
          fi
